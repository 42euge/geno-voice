[project]
name = "geno-voice"
version = "0.1.0"
description = "Offline voice SDK for local AI agents"
requires-python = ">=3.11"

[project.scripts]
geno-voice = "geno_voice.cli:main"
gv = "geno_voice.cli:main"

[project.optional-dependencies]
endpoint = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "grpcio>=1.83",
    "protobuf>=7.35",
    "aiortc>=1.9",
    "av>=13",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geno_voice*", "examples*", "session*", "stt*", "tts*", "vad*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
markers = [
    "slow: large model benchmarks (may take minutes)",
    "quick: small/fast model benchmarks",
]
addopts = "-v --tb=short"

[tool.pytest-benchmark]
disable_gc = true
warmup = true
min_rounds = 3
