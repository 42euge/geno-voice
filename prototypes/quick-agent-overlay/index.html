<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>GenoVoice — Overlay Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="prototype" aria-live="polite"></main>
    <nav id="switcher" class="switcher" aria-label="Prototype variants">
      <button id="previous" aria-label="Previous variant">←</button>
      <div>
        <span class="switcher-kicker">THROWAWAY PROTOTYPE</span>
        <strong id="variant-label"></strong>
      </div>
      <button id="next" aria-label="Next variant">→</button>
    </nav>
    <script type="module" src="./prototype.js"></script>
  </body>
</html>
